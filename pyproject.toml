[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-triage"
version = "1.0.0"
description = "Explainable NLP support ticket classification and triage API"
requires-python = ">=3.11,<3.15"
dependencies = [
    "alembic>=1.13,<2",
    "cryptography>=42,<46",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.110,<1",
    "joblib>=1.3,<2",
    "pandas>=2.1,<4",
    "PyMySQL>=1.1,<2",
    "pydantic>=2,<3",
    "scikit-learn>=1.4,<2",
    "SQLAlchemy>=2.0,<3",
    "spacy>=3.7,<4",
    "uvicorn[standard]>=0.27,<1",
    "vaderSentiment>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "ipykernel>=7,<8",
    "matplotlib>=3.8,<4",
    "pre-commit>=3,<5",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
